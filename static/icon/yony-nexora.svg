<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1877F2"/>
      <stop offset="100%" stop-color="#7B2FF7"/>
    </linearGradient>

    <linearGradient id="text" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E8DFFF"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>

  <!-- Network nodes -->
  <circle cx="115" cy="130" r="14" fill="#FFFFFF" opacity=".9"/>
  <circle cx="397" cy="145" r="14" fill="#FFFFFF" opacity=".9"/>
  <circle cx="398" cy="370" r="14" fill="#FFFFFF" opacity=".9"/>
  <circle cx="114" cy="365" r="14" fill="#FFFFFF" opacity=".9"/>

  <path d="M125 140 L205 205
           M387 155 L315 205
           M387 360 L315 310
           M125 355 L205 310"
        stroke="#FFFFFF"
        stroke-width="8"
        opacity=".35"
        fill="none"
        stroke-linecap="round"/>

  <!-- YN -->
  <text x="256" y="330"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="190"
        font-weight="900"
        letter-spacing="-18"
        fill="url(#text)">YN</text>

  <!-- Small accent -->
  <circle cx="256" cy="105" r="12" fill="#FFFFFF" opacity=".95"/>
</svg>
