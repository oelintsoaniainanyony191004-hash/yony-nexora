<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connexion - Yony Nexora</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f0f2f5;
  color: #172033;
}

.top {
  min-height: 300px;
  padding: 35px 20px 95px;
  text-align: center;
  background: linear-gradient(180deg, #182848, #6C5CE7, #f0f2f5);
}

.nexus-logo, .nexus-logo svg {
  width: 76px;
  height: 76px;
  margin: auto;
}

.brand {
  display: inline-block;
  margin-top: 10px;
  padding: 9px 15px;
  border: 2px solid #FF2D95;
  border-radius: 12px;
  background: white;
  font-size: 25px;
  font-weight: 900;
}

.tagline {
  color: white;
  font-size: 14px;
  margin-top: 8px;
}

.login-card {
  width: calc(100% - 28px);
  max-width: 420px;
  margin: -75px auto 0;
  position: relative;
  background: white;
  border-radius: 12px;
  padding: 20px;
  box-shadow: 0 2px 10px rgba(0,0,0,.12);
}

.title {
  text-align: center;
  font-size: 24px;
  font-weight: 800;
}

.subtitle {
  text-align: center;
  color: #788397;
  font-size: 14px;
  margin: 7px 0 20px;
}

#savedAccounts {
  margin-bottom: 16px;
}

.saved-title {
  font-weight: bold;
  font-size: 16px;
  margin-bottom: 10px;
}

.account-card {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  padding: 9px;
  margin-bottom: 8px;
  border: 1px solid #dddfe2;
  border-radius: 8px;
  background: white;
  text-align: left;
  cursor: pointer;
  font-size: 14px;
}

.avatar {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  background: #e4e6eb;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 23px;
  flex-shrink: 0;
}

.account-name {
  overflow-wrap: anywhere;
  font-weight: bold;
}

.add-account {
  width: 100%;
  padding: 11px;
  border: 0;
  border-radius: 7px;
  background: #1877f2;
  color: white;
  font-weight: bold;
  cursor: pointer;
  font-size: 14px;
}

.field {
  margin-bottom: 12px;
}

.field input {
  width: 100%;
  height: 48px;
  border: 1px solid #dce3ed;
  border-radius: 8px;
  padding: 0 12px;
  font-size: 15px;
  outline: none;
  background: #f8fafc;
}

.password-wrap {
  position: relative;
}

.password-wrap input {
  padding-right: 45px;
}

.eye {
  position: absolute;
  right: 13px;
  top: 14px;
  font-size: 18px;
  cursor: pointer;
}

.login-btn {
  width: 100%;
  height: 48px;
  border: 0;
  border-radius: 8px;
  background: #1877f2;
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

.cancel-btn {
  width: 100%;
  padding: 10px;
  margin-top: 8px;
  border: 1px solid #ddd;
  border-radius: 8px;
  background: white;
  cursor: pointer;
}

.register {
  text-align: center;
  margin-top: 18px;
  font-size: 14px;
  color: #687589;
}

.register a {
  color: #1877f2;
  text-decoration: none;
  font-weight: bold;
}

.bottom {
  text-align: center;
  padding: 35px 20px 25px;
  color: #718096;
  font-size: 13px;
}

.footer-title {
  color: #1877f2;
  font-weight: bold;
  margin-bottom: 5px;
}
</style>
</head>

<body>

<div class="top">
  <div class="nexus-logo">
    <svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="n" x1="0" y1="1" x2="1" y2="0">
          <stop offset="0%" stop-color="#087DF2"/>
          <stop offset="50%" stop-color="#12C8F4"/>
          <stop offset="100%" stop-color="#9B55E9"/>
        </linearGradient>
      </defs>
      <path d="M25 95V25L85 75V25Q85 15 95 15Q105 15 105 25V95Q105 105 95 105Q90 105 85 100L45 65V95Q45 105 35 105Q25 105 25 95Z" fill="url(#n)"/>
    </svg>
  </div>

  <div class="brand">
    <span style="color:#F5B942">𝚈𝚘𝚗𝚢</span>
    <span style="color:#FF2D95">𝐍𝐄𝐗𝐎𝐑𝐀</span>
  </div>

  <div class="tagline">Connecte-toi • Partage • Grandis</div>
</div>

<div class="login-card">
  <div class="title">Connexion</div>
  <div class="subtitle">Entre dans ton compte Yony Nexora</div>

  <div id="savedAccounts"></div>

  <form id="loginForm" method="POST" style="display:none">
    <div class="field">
      <input
        type="text"
        name="username"
        placeholder="Adresse email ou numéro"
        autocomplete="username"
        required>
    </div>

    <div class="field password-wrap">
      <input
        id="password"
        type="password"
        name="password"
        placeholder="Mot de passe"
        autocomplete="current-password"
        required>
      <span class="eye" onclick="togglePassword()">👁</span>
    </div>

    <button class="login-btn" type="submit">Se connecter</button>
    <button class="cancel-btn" type="button" onclick="showAccounts()">
      Annuler
    </button>
  </form>

  <div class="register">
    Tsy mbola manana compte?
    <a href="/register">Créer un compte</a>
  </div>
</div>

<div class="bottom">
  <div class="footer-title">Yony Nexora</div>
  <div>Plus qu’un réseau, une communauté</div>
</div>

<script>
const savedBox = document.getElementById('savedAccounts');
const loginForm = document.getElementById('loginForm');
const savedKey = 'yony_saved_accounts';

function getAccounts() {
  try {
    return JSON.parse(localStorage.getItem(savedKey) || '[]');
  } catch (e) {
    return [];
  }
}

function showAccounts() {
  loginForm.style.display = 'none';
  savedBox.style.display = 'block';
  savedBox.innerHTML = '';

  const accounts = getAccounts();

  if (accounts.length > 0) {
    const title = document.createElement('div');
    title.className = 'saved-title';
    title.textContent = 'Comptes enregistrés';
    savedBox.appendChild(title);

    accounts.forEach(account => {
      const card = document.createElement('button');
      card.type = 'button';
      card.className = 'account-card';

      const avatar = document.createElement('div');
      avatar.className = 'avatar';
      avatar.textContent = '👤';

      const name = document.createElement('span');
      name.className = 'account-name';
      name.textContent = account;

      card.append(avatar, name);

      card.onclick = () => {
        loginForm.style.display = 'block';
        savedBox.style.display = 'none';
        loginForm.querySelector('[name="username"]').value = account;
        loginForm.querySelector('[name="password"]').value = '';
        loginForm.querySelector('[name="password"]').focus();
      };

      savedBox.appendChild(card);
    });
  }

  const add = document.createElement('button');
  add.type = 'button';
  add.className = 'add-account';
  add.textContent = '+ Ajouter un compte';

  add.onclick = () => {
    savedBox.style.display = 'none';
    loginForm.style.display = 'block';
    loginForm.reset();
    loginForm.querySelector('[name="username"]').focus();
  };

  savedBox.appendChild(add);
}

function togglePassword() {
  const password = document.getElementById('password');
  password.type = password.type === 'password' ? 'text' : 'password';
}

loginForm.addEventListener('submit', () => {
  const username = loginForm.querySelector('[name="username"]').value.trim();
  if (!username) return;

  const accounts = getAccounts();
  const updated = [
    username,
    ...accounts.filter(account => account !== username)
  ].slice(0, 5);

  localStorage.setItem(savedKey, JSON.stringify(updated));
});

showAccounts();
</script>

</body>
</html>
```
