<!DOCTYPE html>
<html lang="mg">
<head><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connexion - Yony Nexora</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#fff;
color:#172033;
}

.top{
min-height:380px;
padding:45px 20px 110px;
text-align:center;
background:linear-gradient(180deg,#182848,#6C5CE7,#fff);
}

.nexus-logo{
width:90px;
height:90px;
margin:auto;
}

.nexus-logo svg{
width:90px;
height:90px;
}

.brand{font-size:30px;font-weight:900;margin-top:10px;letter-spacing:1px;}

.tagline{
color:#fff;
font-size:14px;
margin-top:8px;
}

.login-card{
width:calc(100% - 32px);
max-width:420px;
margin:-90px auto 0;
position:relative;
background:#fff;
border-radius:20px;
padding:25px 20px;
box-shadow:0 5px 20px rgba(0,0,0,.12);
}

.title{
text-align:center;
font-size:26px;
font-weight:800;
}

.subtitle{
text-align:center;
color:#788397;
font-size:14px;
margin:7px 0 22px;
}

.field{
margin-bottom:14px;
}

.field input{
width:100%;
height:50px;
border:1px solid #dce3ed;
border-radius:12px;
padding:0 14px;
font-size:15px;
outline:none;
background:#f8fafc;
}

.password-wrap{
position:relative;
}

.password-wrap input{
padding-right:45px;
}

.eye{
position:absolute;
right:14px;
top:15px;
font-size:18px;
cursor:pointer;
}

.login-btn{
width:100%;
height:52px;
border:0;
border-radius:12px;
background:linear-gradient(135deg,#087df2,#1698ff);
color:white;
font-size:16px;
font-weight:800;
}

.register{
text-align:center;
margin-top:20px;
font-size:14px;
color:#687589;
}

.register a{
color:#087df2;
text-decoration:none;
font-weight:800;
}

.bottom{
text-align:center;
padding:55px 20px 30px;
color:#718096;
font-size:13px;
}

.footer-title{
color:#087df2;
font-weight:800;
margin-bottom:5px;
}
<style>.yony-text{color:#00A8FF!important;font-weight:900}.nexora-text{color:#2979FF!important;font-weight:900}<style>.yony-style{font-weight:900;color:#2979FF !important}.nexora-style{font-weight:900;color:#FF2D95 !important;letter-spacing:1px}</style>\n</style>\n<style>.yony-style{font-weight:900;color:#2979FF !important}.nexora-style{font-weight:900;color:#FF2D95 !important;letter-spacing:1px}</style>\n</style>
</head>

<body>

<div class="top">

<div class="nexus-logo">
<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">

<defs>
<linearGradient id="n" x1="0" y1="1" x2="1" y2="0">
<stop offset="0%" stop-color="#087DF2"/>
<stop offset="50%" stop-color="#12C8F4"/>
<stop offset="100%" stop-color="#9B55E9"/>
</linearGradient>
</defs>

<path
d="M25 95V25L85 75V25Q85 15 95 15Q105 15 105 25V95Q105 105 95 105Q90 105 85 100L45 65V95Q45 105 35 105Q25 105 25 95Z"
fill="url(#n)"/>
</svg>
</div>

<div class="brand" style="display:inline-block;padding:10px 18px;border:2px solid #FF2D95;border-radius:14px;background:#fff;box-shadow:0 3px 12px rgba(255,45,149,.18);"><span style="color:#F5B942 !important;font-weight:900">𝚈𝚘𝚗𝚢</span> <span style="color:#FF2D95 !important;font-weight:900">𝐍𝐄𝐗𝐎𝐑𝐀</span></div>

<div class="tagline">
Connecte-toi • Partage • Grandis
</div>

</div>

<div class="login-card">

<div class="title">Connexion</div>

<div class="subtitle">
Entre dans ton compte Yony Nexora
</div>

{% if saved_accounts %}<div style="margin-bottom:18px"><b>Comptes enregistrés</b>{% for account in saved_accounts %}<button type="button" onclick="document.querySelector('[name=username]').value='{{ account['username'] if account is mapping else account[1] }}'" style="display:block;width:100%;padding:12px;margin-top:8px;border:1px solid #dce3ed;border-radius:12px;background:#f8fafc;text-align:left">👤 {{ account['username'] if account is mapping else account[1] }}</button>{% endfor %}</div>{% endif %}

<form method="POST">

<div class="field">
<input
type="text"
name="username"
placeholder="Adresse email ou numéro"
autocomplete="username"
required>
</div>

<div class="field password-wrap">

<input
id="password"
type="password"
name="password"
placeholder="Mot de passe"
autocomplete="current-password"
required>

<span class="eye" onclick="togglePassword()">👁</span>

</div>

<button class="login-btn" type="submit">
Se connecter
</button>

</form>

<div class="register">
Tsy mbola manana compte?
<a href="/register">Créer un compte</a>
</div>

</div>

<div class="bottom">

<div class="footer-title">
Yony Nexora
</div>

<div>
Plus qu’un réseau, une communauté
</div>

</div>

<script>
function togglePassword(){
const p=document.getElementById("password");
p.type=p.type==="password"?"text":"password";
}
</script>

</body>
</html>
